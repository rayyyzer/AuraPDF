[package]
name = "app"
version = "0.9.0"
description = "Native Windows desktop PDF reader and annotation studio"
authors = ["A R Muhammad Rayhan <rayyyzer@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/rayyyzer/AuraPDF"
edition = "2021"
rust-version = "1.77.2"
default-run = "AuraPDF"

[[bin]]
name = "AuraPDF"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-updater = "2"
pdfium-render = "0.9.4"
lazy_static = "1.5.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Security_Cryptography",
  "Storage_Streams",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
strip = true
debug = 0
